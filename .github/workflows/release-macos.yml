name: Transfer verified macOS update artifact
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      include_intel:
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Transfer exact verified artifact to existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: HuangguaOrg/huanggua-ai-canvas
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.tag }}" = "v0.11.11"
          gh api repos/HuangguaOrg/huanggua-ai-canvas/actions/runs/45668974400 > run.json
          jq -e '.conclusion == "success" and .head_sha == "2683b0dc393f0b2959305cc2c76dc9f7c3de14d2"' run.json
          gh api repos/HuangguaOrg/huanggua-ai-canvas/releases/458449675 > release.json
          jq -e '.draft == true and .tag_name == "v0.11.11"' release.json
          gh api repos/HuangguaOrg/huanggua-ai-canvas/actions/artifacts/15050512406/zip > macos-gitee-update-transfer.zip
          echo "6a32057550fe7f53dc6a9838b909c32f9c1803fdb6fe24bd6def35b291bf22ca  macos-gitee-update-transfer.zip" | sha256sum --check
          gh release upload v0.11.11 macos-gitee-update-transfer.zip --repo "$GH_REPO"
