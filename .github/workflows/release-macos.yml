name: Transfer verified updates to Gitee
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      include_intel:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download exact signed build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.tag }}" = "v0.11.13"
          gh api repos/HuangguaOrg/huanggua-ai-canvas/actions/runs/45954668264 > run.json
          jq -e '.conclusion == "success" and .head_sha == "e2cc6fdd6349bc48daecb1c2fb600b4ed106011e"' run.json
          mkdir -p payload
          gh api repos/HuangguaOrg/huanggua-ai-canvas/actions/artifacts/15179212920/zip > payload/mac.zip
          echo "9029c0c4176b6859365364bbaeef6becf60c2a1fee8d68c9e0b2c768c6d499d1  payload/mac.zip" | sha256sum --check
      - name: Upload and publicly verify updates without changing feed
        env:
          TEMP_GITEE_TOKEN: ${{ secrets.TEMP_GITEE_RELEASE_01113 }}
        run: python3 -u release-transfer.py
